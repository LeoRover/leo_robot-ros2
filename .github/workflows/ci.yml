name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - humble-backports
  pull_request:
    branches:
      - humble-backports

jobs:
  industrial_ci:
    runs-on: ubuntu-24.04
    env:
      ROS_DISTRO: humble
      ROS_REPO: main
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Source tests
        uses: "ros-industrial/industrial_ci@master"
        env:
          UPSTREAM_WORKSPACE: "github:LeoRover/leo_common-ros2#humble-backports"
